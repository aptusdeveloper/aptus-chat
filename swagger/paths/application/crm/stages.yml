parameters:
  - $ref: '#/components/parameters/account_id'
  - name: crm_pipeline_id
    in: path
    required: true
    schema: { type: string, format: uuid }
get:
  tags: [CRM]
  summary: Listar estágios do pipeline
  security: [{ userApiKey: [] }]
  responses:
    '200':
      description: Estágios retornados com sucesso.
      content:
        application/json:
          schema:
            type: object
            properties:
              payload: { type: array, items: { $ref: '#/components/schemas/crm_stage' } }
post:
  tags: [CRM]
  summary: Criar estágio no pipeline
  security: [{ userApiKey: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [stage]
          properties:
            stage:
              type: object
              required: [name, color]
              properties:
                name: { type: string }
                color: { type: string }
                position: { type: integer }
                is_win: { type: boolean }
                is_loss: { type: boolean }
  responses:
    '200': { description: Estágio criado com sucesso. }
