type: object
properties:
  id:
    type: number
    description: The ID of the webhook
  url:
    type: string
    description: The url to which the events will be send
  name:
    type: string
    description: The name of the webhook
  subscriptions:
    type: array
    items:
      type: string
      enum: [
        "conversation_created",
        "conversation_status_changed",
        "conversation_updated",
        "contact_created",
        "contact_updated",
        "message_created",
        "message_updated",
        "webwidget_triggered",
        "conversation_typing_on",
        "conversation_typing_off"
      ]
    description: The list of subscribed events
  secret:
    type: string
    nullable: true
    description: Segredo usado para assinar as requisições de webhook. As entregas assinadas incluem os cabeçalhos técnicos `X-Chatwoot-Timestamp` e `X-Chatwoot-Signature`; a assinatura contém `sha256=` seguido pelo HMAC-SHA256 de `{timestamp}.{raw_request_body}` usando este segredo. Quando disponível, o identificador da entrega é enviado em `X-Chatwoot-Delivery`.
  account_id:
    type: number
    description: The id of the account which the webhook object belongs to
