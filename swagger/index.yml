openapi: '3.1.0'
info:
  title: AptusChat API
  description: Documentação completa das APIs HTTP do servidor AptusChat.
  version: 2.0.0
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
servers:
  - url: /
    description: Servidor AptusChat atual
paths:
  $ref: ./paths/index.yml
components:
  schemas:
    $ref: ./definitions/index.yml
  parameters:
    $ref: ./parameters/index.yml
  securitySchemes:
    userApiKey:
      type: apiKey
      in: header
      name: api_access_token
      description: Token obtido na página de perfil ou pelo console Rails. O acesso respeita as permissões do usuário.
    agentBotApiKey:
      type: apiKey
      in: header
      name: api_access_token
      description: Token fornecido pelo administrador para integrações com bots, com acesso limitado às APIs permitidas.
    platformAppApiKey:
      type: apiKey
      in: header
      name: api_access_token
      description: Token criado pelo administrador para provisionar contas, usuários, funções e bots da plataforma.
tags:
